# A "needs" element containing an expression is not a real job ID. Only the expression-side
# error is reported; the job-needs rule must not report a contradictory "does not exist" error.
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - run: echo hi
  b:
    needs:
      - a
      # ERROR: this position has no context availability so the context is denied (default config)
      - ${{ github.job }}
    runs-on: ubuntu-latest
    steps:
      - run: echo hi
